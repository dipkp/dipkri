<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="youpi-flow-title youpi-flow-desc">
        <title id="youpi-flow-title">YouPI payment lifecycle swimlane</title>
        <desc id="youpi-flow-desc">Swimlane diagram of the YouPI payment flow: store checkout creates a gateway session, the session queues then becomes active, a UPI payment is observed by SMS, Gmail or Android observers, moves to processing and reconciliation, and a signed webhook credits the wallet ledger. A coral callout marks an uncommitted bypass that marks payments successful after 2.5 seconds, which skips reconciliation and therefore credits nothing.</desc>

        <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lane dividers -->
        <line x1="40" y1="96"  x2="960" y2="96"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="256" x2="960" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="160" y1="96" x2="160" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Lane labels -->
        <text x="56" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STOREFRONT</text>
        <text x="56" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GATEWAY</text>
        <text x="56" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WALLET</text>

        <!-- Arrows first -->
        <line x1="270" y1="152" x2="270" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="208" x2="340" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="460" y1="208" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="620" y1="208" x2="640" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="780" y1="208" x2="800" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="870" y1="232" x2="870" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Bypass arrow (dashed coral) -->
        <line x1="400" y1="232" x2="400" y2="272" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-coral)"/>

        <!-- Arrow labels (mask + 6-10px gap) -->
        <rect x="276" y="158" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="302" y="167" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>

        <rect x="876" y="242" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="251" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED</text>

        <!-- Storefront node -->
        <rect x="180" y="104" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="270" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store checkout</text>
        <text x="270" y="138" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">price from page</text>

        <!-- Gateway nodes -->
        <rect x="180" y="184" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="250" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session created</text>
        <text x="250" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INITIATED · QUEUED</text>

        <rect x="340" y="184" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ACTIVE</text>
        <text x="400" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5-min timer</text>

        <rect x="480" y="184" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="550" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UPI observed</text>
        <text x="550" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sms · gmail · android</text>

        <rect x="640" y="184" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="710" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PROCESSING</text>
        <text x="710" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">evidence matched</text>

        <rect x="800" y="184" width="140" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="870" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RECONCILED</text>
        <text x="870" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">settlement proven</text>

        <!-- Wallet node -->
        <rect x="800" y="276" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="870" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coin credit</text>
        <text x="870" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sig · amount · idempotent</text>

        <!-- Bypass callout -->
        <rect x="300" y="272" width="220" height="64" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="316" y="290" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">UNCOMMITTED BYPASS</text>
        <text x="316" y="304" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif">SUCCESS after 2.5 s, no evidence —</text>
        <text x="316" y="318" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif">wallet still waits for RECONCILED</text>

        <!-- Legend -->
        <line x1="40" y1="384" x2="960" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="390" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="132" y="399" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

        <rect x="196" y="390" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="216" y="399" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Settlement gate</text>

        <rect x="332" y="390" width="14" height="10" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="352" y="399" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Bypass, live in prod</text>

        <line x1="490" y1="395" x2="514" y2="395" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="522" y="399" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Credits money</text>
      </svg>