<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="popcorn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="popcorn-butter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="red-stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="white-stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="popcorn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#popcorn-glow)">
    <!-- Back row popcorn puffs -->
    <circle cx="21" cy="22" r="7.5" fill="url(#popcorn-gold)"/>
    <circle cx="32" cy="17" r="8.5" fill="url(#popcorn-gold)"/>
    <circle cx="43" cy="22" r="7.5" fill="url(#popcorn-gold)"/>

    <!-- Middle row puffs -->
    <circle cx="15" cy="27" r="6.5" fill="url(#popcorn-butter)"/>
    <circle cx="26" cy="23" r="8" fill="url(#popcorn-butter)"/>
    <circle cx="38" cy="23" r="8" fill="url(#popcorn-butter)"/>
    <circle cx="49" cy="27" r="6.5" fill="url(#popcorn-butter)"/>
    
    <!-- Top center peak puff -->
    <circle cx="32" cy="13" r="7" fill="url(#popcorn-butter)"/>
    <circle cx="27" cy="15" r="5" fill="#FEF08A"/>
    <circle cx="37" cy="15" r="5" fill="#FEF08A"/>

    <!-- Front puffs -->
    <circle cx="21" cy="29" r="6.5" fill="#FDE047"/>
    <circle cx="32" cy="28" r="8" fill="#FDE047"/>
    <circle cx="43" cy="29" r="6.5" fill="#FDE047"/>

    <!-- Popcorn Tub / Bucket -->
    <clipPath id="tub-clip">
      <path d="M 12 30 L 16 57 C 16.5 59.5 18.5 61 21 61 L 43 61 C 45.5 61 47.5 59.5 48 57 L 52 30 Z"/>
    </clipPath>

    <g clip-path="url(#tub-clip)">
      <rect x="0" y="30" width="64" height="34" fill="url(#red-stripe)"/>
      <rect x="18" y="30" width="6" height="34" fill="url(#white-stripe)"/>
      <rect x="29" y="30" width="6" height="34" fill="url(#white-stripe)"/>
      <rect x="40" y="30" width="6" height="34" fill="url(#white-stripe)"/>
    </g>

    <!-- Tub Rim -->
    <rect x="10" y="28" width="44" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="11" y="29" width="42" height="2" rx="1" fill="#FFFFFF"/>
  </g>
</svg>
